[package]
name = "openpdn-wasm"
description = "OpenPDN engine for the browser (wasm-bindgen wrapper around openpdn-editor)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Multithreaded build: needs nightly + rust-src (-Z build-std with atomics), see README.
threads = ["openpdn-editor/parallel", "dep:wasm-bindgen-rayon"]

[dependencies]
openpdn-editor = { path = "../openpdn-editor", default-features = false }
openpdn-formats = { path = "../openpdn-formats", default-features = false }
wasm-bindgen = "0.2.100"
wasm-bindgen-rayon = { version = "1.2", optional = true }
